<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>Dishes</title>
  
  <!-- HTML -->
  
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div id="navBar">
    <div class="navbarChild">Dishes</div>
    <div class="navbarChild iconContainer hidden" id="themeTogglerBox">
      <i class="fas fa-sun" id="themeToggler">
      </i>
    </div>
  </div>
  
  <div id="dishesInputBox">
    <input type="text" name="dishesInput" placeholder="Search about any dish..." id="dishesInput">
    <div id="searchButton">
      <i class="fas fa-search"></i>
    </div>
  </div>
  
  <!-- searched resultssssssss -->
  <div id="searchedResults">
  </div>
  <!-- search selected -->
  <div id="dishRecipeBox">
    <img id="dishImg">
    <div id="dishRecipeHeader">
      <div class="dishRecipeHeaderChild">
        <p id="selectedDishName"></p>
      </div>
      <div id="closeButton" class="dishRecipeHeaderChild iconContainer">
        <i class="fas fa-times">
        </i>
      </div>
    </div>
    <div id="dishDiscriptionBox">
    </div>
    <div id="dishIngredientsBox">
      
    </div>
    <div id="dishTutorialLinkBox">
      <a id="tutorialLink" href="">
        <i class="
        fa-brands
        fa-youtube
        ">
        </i>
        See Tutorial On Youtube!
      </a>
    </div>
  </div>
  <div id="dishMenu">
    <div id="dishCategorySelectorBox">
      <select name="dishCategorySelector" id="dishCategorySelector">
      
        <optgroup label="Select Category:">
        </optgroup>
        <optgroup label="Vegetarian">
          <option selected selecvalue="Vegetarian">
            Vegetarian
          </option>
          
          <option value="Vegan">
            Vegan
          </option>
        </optgroup>
        
        <optgroup label="Non-Vegetarian">
          <option value="Chicken">
            Chicken
          </option>
          
          <option value="Beef">
            Beef
          </option>
          
          <option value="Seafood">
            Seafood
          </option>
          
          <option value="Lamb">
            Lamb
          </option>
          
          <option value="Goat">
            Goat
          </option>
        </optgroup>
        
        <optgroup label="Other Categories">
          <option value="Dessert">
            Dessert
          </option>
          
          <option value="Breakfast">
            Breakfast
          </option>
          
          <option value="Pasta">
            Pasta
          </option>
          
          <option value="Starter">
            Starter
          </option>
          
          <option value="Side">
            Side
          </option>
          
          <option value="Miscellaneous">
            Miscellaneous
          </option>
        </optgroup>
        
      </select>
    </div>
    <div id="dishMenuHeader">recommended dishes:
    </div>
    <div id="loadMoreButtonBox">
      <div id="div">
        load more dishes
      </div>
      <i class="fas fa-angle-down">
      </i>
    </div>
  </div>
  <script src="main.js"></script>
</body>

</html>
