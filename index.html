<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>Dishes</title>
  
  <!-- HTML -->
  
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div id="navBar">
    <div class="navbarChild">Dishes</div>
    <div class="navbarChild iconContainer hidden" id="themeTogglerBox">
      <i class="fas fa-sun" id="themeToggler">
      </i>
    </div>
  </div>
  
  <div id="dishesInputBox">
    <input type="text" name="dishesInput" placeholder="Search about any dish..." id="dishesInput">
    <div id="searchButton">
      <i class="fas fa-search"></i>
    </div>
  </div>
  
  <!-- searched resultssssssss -->
  <div id="searchedResults">
  </div>
 <!-- search selected -->
  <div id="dishRecipeBox">
    <img id="dishImg">
    <div id="dishRecipeHeader">
      <div class="dishRecipeHeaderChild">
        <p id="selectedDishName"></p>
      </div>
      <div id="closeButton"
      class="dishRecipeHeaderChild iconContainer">
        <i class="fas fa-times">
        </i>
      </div>
    </div>
    <div id="dishDiscriptionBox">
    </div>
  </div>
  <div id="dishMenu">
    <div id="dishMenuHeader">recommended dishes:
    </div>
    
  </div>
  <script src="main.js"></script>
</body>

</html>
